    {
        q: "Điều lệnh nội vụ CAND quy định như thế nào về quan hệ giữa thủ trưởng với các phó thủ trưởng?",
        a: [

            "Chương trình, kế hoạch công tác phải được tổ chức thực hiện nghiêm túc, có kiểm tra đôn đốc và đánh giá kết quả thực hiện. Cán bộ, chiến sĩ, kể cả cán bộ làm các nhiệm vụ cần giữ bí mật nghiệp vụ phải ghi sổ kế hoạch đầy đủ, cụ thể.",

            "Cán bộ trực ban khi làm nhiệm vụ phải giúp thủ trưởng nắm vững quân số, vũ khí, trang bị, phương tiện; đề xuất giải quyết các yêu cầu công tác và nắm tình hình của đơn vị về công tác chính trị tư tưởng.",

        ]

let processedQuestions = [];

// Thuật toán xáo trộn Fisher-Yates
function shuffle(array) {
    let currentIndex = array.length, randomIndex;
    while (currentIndex !== 0) {
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
    }
    return array;
}

// Khởi tạo bài thi
function initQuiz() {
    const container = document.getElementById('questions-container');
    container.innerHTML = '';

    // Xáo trộn 40 câu hỏi gốc
    let shuffledQ = shuffle([...rawQuestions]);

    processedQuestions = shuffledQ.map((item, qIndex) => {
        let originalCorrectText = item.a[0]; // Đáp án đúng luôn ở vị trí 0 ban đầu
        let shuffledAnswers = shuffle([...item.a]); // Xáo trộn đáp án
        
        return {
            qIndex: qIndex,
            title: item.q,
            answers: shuffledAnswers,
            correctText: originalCorrectText
        };
    });

    // Render danh sách câu hỏi ra màn hình
    processedQuestions.forEach((item, index) => {
        let qCard = document.createElement('div');
        qCard.className = 'question-card';
        qCard.id = `q-card-${index}`;

        let labels = ['A', 'B', 'C', 'D'];
        let optionsHTML = item.answers.map((ans, aIdx) => `
            <li class="option-item">
                <label class="option-label">
                    <input type="radio" name="question_${index}" value="${labels[aIdx]}" data-text="${encodeURIComponent(ans)}" onchange="updateProgress()">
                    <b>${labels[aIdx]}.</b>&nbsp;${ans}
                </label>
            </li>
        `).join('');

        qCard.innerHTML = `
            <div class="question-title">Câu ${index + 1}: ${item.title}</div>
            <ul class="options">${optionsHTML}</ul>
            <div class="answer-key" id="key-${index}" style="display:none;"></div>
        `;
        container.appendChild(qCard);
    });

    updateProgress();
}

// Đếm tiến độ làm bài
function updateProgress() {
    let answeredCount = 0;
    for (let i = 0; i < processedQuestions.length; i++) {
        let selected = document.querySelector(`input[name="question_${i}"]:checked`);
        if (selected) answeredCount++;
    }
    document.getElementById('progress-text').innerText = `Đã hoàn thành: ${answeredCount} / ${processedQuestions.length} câu`;
    return answeredCount;
}

// Chấm điểm & Hiển thị kết quả
function submitQuiz() {
    let answeredCount = updateProgress();
    
    if (answeredCount < processedQuestions.length) {
        alert(`Bạn chưa làm hết 40 câu! Hiện tại bạn mới chọn ${answeredCount}/40 câu. Vui lòng hoàn thành tất cả các câu trước khi nộp bài.`);
        return;
    }

    let score = 0;
    let labels = ['A', 'B', 'C', 'D'];

    processedQuestions.forEach((item, index) => {
        let selectedOption = document.querySelector(`input[name="question_${index}"]:checked`);
        let selectedText = decodeURIComponent(selectedOption.getAttribute('data-text'));
        
        // Tìm vị trí đáp án đúng tương ứng với ký tự A, B, C hiện tại
        let correctOptionIndex = item.answers.indexOf(item.correctText);
        let correctLabel = labels[correctOptionIndex];

        let card = document.getElementById(`q-card-${index}`);
        let keyBox = document.getElementById(`key-${index}`);

        if (selectedText === item.correctText) {
            score++;
            card.classList.add('correct');
            keyBox.innerHTML = `✓ Chính xác! Đáp án đúng là: <b>${correctLabel}</b>`;
            keyBox.style.color = '#2e7d32';
        } else {
            card.classList.add('incorrect');
            keyBox.innerHTML = `✗ Sai rồi! Bạn chọn (${selectedOption.value}). Đáp án đúng phải là: <b>${correctLabel}</b>`;
            keyBox.style.color = '#c62828';
        }
        keyBox.style.display = 'block';
    });

    // Hiển thị tổng điểm
    let resultBox = document.getElementById('result');
    resultBox.style.display = 'block';
    resultBox.innerHTML = `
        <h2>KẾT QUẢ BÀI THI</h2>
        <p style="font-size: 1.2rem;">Bạn đã trả lời đúng <b>${score} / ${processedQuestions.length}</b> câu.</p>
        <p>Tỷ lệ chính xác: <b>${((score / processedQuestions.length) * 100).toFixed(1)}%</b></p>
    `;
    
    // Tự động cuộn xuống phần kết quả
    resultBox.scrollIntoView({ behavior: 'smooth' });
}

// Chạy tự động khi tải trang
window.onload = initQuiz;
